book:
  id: modern-java
  title: Modern Java and Object-Oriented Design
  subtitle: Practical Java 8–25
  audience:
    - Senior Java developers
    - Developers modernizing Java 8 codebases
    - Interview candidates preparing for senior-level roles

style:
  tone: practical
  includeInterviewQuestions: true
  includeExercises: true

output:
  markdown: true
  zip: true

chapters:
  - id: introduction
    title: Modern Java in Context
    targetWords: 4500
    objectives:
      - Explain how Java's release cadence and support choices affect application maintenance.
      - Distinguish language, library, JVM, and tooling changes across modern Java releases.
      - Build a practical decision framework for choosing a Java baseline.
      - Identify compatibility, migration, and operational risks before upgrading.
    topics:
      - Six-month feature releases and long-term-support releases
      - JDK, JRE, JVM, vendors, distributions, and runtime images
      - Language evolution from Java 8 through Java 25
      - Compatibility contracts and dependency readiness
      - Upgrade planning, testing, rollout, and observability
    topicsToAvoid:
      - Exhaustive release-note catalogs
      - Vendor pricing comparisons
      - Framework-specific migration instructions

  - id: object-oriented-design
    title: Object-Oriented Design That Protects Change
    targetWords: 6000
    canonicalExample:
      name: order-processing
      description: A small order-processing domain used consistently throughout this chapter.
      entities:
        - Order
        - OrderLine
        - Money
        - Customer
      constraints:
        - Use BigDecimal for money.
        - Define and apply an explicit rounding policy when arithmetic changes scale.
        - Keep the Money equality and currency-precision policy consistent across snippets.
        - Use immutable data carriers where appropriate.
        - Use constructor injection in service examples.
    objectives:
      - Explain encapsulation, abstraction, polymorphism, and composition in terms of change.
      - Model invariants and responsibilities instead of merely arranging classes.
      - Compare composition, inheritance, delegation, and interfaces with concrete tradeoffs.
      - Refactor a procedural design into cohesive, testable objects.
      - Recognize coupling and cohesion problems during design review.
    topics:
      - Encapsulation and invariant protection
      - Responsibility assignment and collaboration
      - Composition over inheritance
      - Interfaces, delegation, and seams for testing
      - Cohesion, coupling, and dependency direction
      - Domain examples for services, policies, and value objects
    topicsToAvoid:
      - Design-pattern catalogs without design pressure
      - Framework annotations as a substitute for modeling
      - Metaphorical explanations that replace executable examples

  - id: solid
    title: SOLID Without Dogma
    targetWords: 5000
    objectives:
      - Interpret each SOLID principle as a design heuristic rather than a law.
      - Detect responsibilities, abstractions, and substitutions that do not fit their clients.
      - Apply focused refactorings to reduce change amplification.
      - Explain when an abstraction is premature or harmful.
      - Defend design choices using context and tradeoffs.
    topics:
      - Single Responsibility and reasons to change
      - Open/Closed through stable policies and extension points
      - Liskov Substitution and behavioral contracts
      - Interface Segregation and client-shaped interfaces
      - Dependency Inversion and stable boundaries
      - Costs of over-abstraction and speculative flexibility
    topicsToAvoid:
      - Treating SOLID acronyms as a checklist for every class
      - Claiming that more interfaces automatically improve design
      - Framework-specific dependency injection configuration

  - id: collections
    title: Collections and Data-Oriented Choices
    targetWords: 5000
    objectives:
      - Select collection types based on access patterns, ordering, uniqueness, and mutation.
      - Explain equality, hashing, ordering, and mutability requirements.
      - Compare lists, sets, maps, queues, deques, and immutable collections.
      - Diagnose common collection performance and correctness failures.
      - Design collection boundaries that prevent accidental mutation.
    topics:
      - List, set, map, queue, and deque contracts
      - Hash-based and tree-based implementations
      - Equality, hashing, Comparable, and Comparator
      - Immutable and unmodifiable collections
      - Capacity, iteration, lookup, and memory tradeoffs
      - Null handling and collection API boundaries
    topicsToAvoid:
      - Unverified constant-factor benchmarks
      - Internal implementation trivia without design relevance
      - Third-party collection libraries

  - id: generics
    title: Generics, Variance, and Type-Safe APIs
    targetWords: 5000
    objectives:
      - Explain type parameters, bounds, wildcards, and type inference.
      - Apply producer-extends and consumer-super reasoning without relying on slogans alone.
      - Design generic APIs that preserve useful type information.
      - Explain erasure and its consequences for runtime checks and arrays.
      - Identify unsafe casts and improve their boundaries.
    topics:
      - Generic classes, methods, and constructors
      - Upper and lower bounds
      - Wildcards, capture, and nested generic types
      - Type inference and target typing
      - Erasure, reifiable types, and heap pollution
      - Generic collections and API design
    topicsToAvoid:
      - Compiler implementation details unrelated to API behavior
      - Raw types as a recommended compatibility strategy
      - Advanced reflection libraries

  - id: lambdas-functional-interfaces
    title: Lambdas and Functional Interfaces
    targetWords: 5000
    objectives:
      - Explain lambdas as behavior values with target types.
      - Choose standard or domain-specific functional interfaces appropriately.
      - Use method references and closures without obscuring intent.
      - Recognize capture, checked-exception, and debugging tradeoffs.
      - Keep functional code readable at service boundaries.
    topics:
      - Functional interface contracts
      - Lambda syntax, target typing, and method references
      - Captured variables and effectively final state
      - Predicate, Function, Consumer, Supplier, and operators
      - Designing domain-specific functional interfaces
      - Readability and debugging of nested lambdas
    topicsToAvoid:
      - Rewriting every loop as a lambda
      - Functional programming theory beyond practical Java use
      - Reactive frameworks

  - id: streams
    title: Streams for Clear Data Transformations
    targetWords: 5500
    objectives:
      - Explain stream pipelines, laziness, and terminal operations.
      - Build readable transformations with filtering, mapping, grouping, and reduction.
      - Preserve correctness when handling ordering, duplicates, and empty results.
      - Compare sequential and parallel streams using workload and boundary considerations.
      - Recognize when a loop communicates intent more clearly.
    topics:
      - Sources, intermediate operations, and terminal operations
      - Mapping, filtering, flattening, grouping, and partitioning
      - Reduction, collectors, and mutable reduction hazards
      - Primitive streams and boxing tradeoffs
      - Ordering, side effects, and pipeline debugging
      - Parallel stream constraints and alternatives
    topicsToAvoid:
      - Treating parallel streams as a general performance switch
      - Full reactive-streams specifications
      - Collector micro-optimizations without measurement

  - id: optional-error-design
    title: Optional and Explicit Error Design
    targetWords: 5000
    objectives:
      - Use Optional to communicate absence at appropriate API boundaries.
      - Distinguish absence, invalid input, operational failure, and programmer error.
      - Design exception types and error results that preserve useful context.
      - Avoid nested, eager, or misleading Optional usage.
      - Choose failure behavior that callers can handle consistently.
    topics:
      - Optional creation, transformation, and terminal operations
      - Return types versus fields, parameters, and serialization
      - Exceptions, validation, and domain failures
      - Result-style alternatives and error aggregation
      - Logging, cause chains, and safe error messages
      - Boundary translation between technical and domain errors
    topicsToAvoid:
      - Presenting Optional as a universal replacement for null
      - Framework-specific error envelopes
      - Recovering from every exception indiscriminately

  - id: records-sealed-patterns
    title: Records, Sealed Classes, and Pattern Matching
    targetWords: 5500
    objectives:
      - Choose records for immutable data carriers with transparent state.
      - Model restricted hierarchies with sealed classes and interfaces.
      - Use pattern matching to make type-driven logic explicit.
      - Identify version and preview-feature constraints in production adoption.
      - Combine these features without weakening domain invariants.
    topics:
      - Record components, canonical constructors, and validation
      - Records versus regular classes
      - Sealed types, permits clauses, and exhaustive reasoning
      - Pattern matching for instanceof and switch
      - Null behavior, dominance, and totality in pattern switches
      - Migration and compatibility considerations across Java releases
    topicsToAvoid:
      - Treating preview syntax as universally available
      - Exhaustive compiler grammar
      - Serialization frameworks not required for the design discussion

  - id: concurrency-foundations
    title: Concurrency Foundations and Safe Shared State
    targetWords: 5000
    objectives:
      - Explain visibility, atomicity, ordering, and race conditions.
      - Select synchronization, locks, atomics, or message passing for a problem.
      - Design cancellation, lifecycle, and failure handling for concurrent tasks.
      - Identify deadlock, starvation, contention, and unsafe publication risks.
      - Test concurrent behavior without relying on timing luck.
    topics:
      - Java Memory Model concepts
      - Synchronized blocks, locks, atomics, and concurrent collections
      - Executors, futures, and task boundaries
      - Safe publication and immutable state
      - Cancellation, interruption, and timeout handling
      - Deadlock diagnosis and concurrency testing
    topicsToAvoid:
      - Distributed systems coordination
      - Lock-free algorithm proofs
      - Framework-specific schedulers

  - id: virtual-threads
    title: Virtual Threads and Thread-Per-Task Design
    targetWords: 5000
    objectives:
      - Explain how virtual threads change the economics of blocking I/O.
      - Identify workloads that benefit and workloads that do not.
      - Migrate executor-based code while preserving cancellation and limits.
      - Recognize pinning, thread-local, synchronization, and resource-pool concerns.
      - Establish measurement criteria before and after adoption.
    topics:
      - Platform threads versus virtual threads
      - Thread-per-request and thread-per-task designs
      - Structured concurrency as version-qualified context
      - Blocking I/O, pinning, and monitor interactions
      - Connection pools, semaphores, and external bottlenecks
      - Operational visibility and migration strategy
    topicsToAvoid:
      - Claiming virtual threads make CPU work faster
      - Treating them as a replacement for every concurrency primitive
      - Framework-specific server configuration

  - id: jvm-memory-garbage-collection
    title: JVM Memory and Garbage Collection
    targetWords: 5500
    objectives:
      - Describe heap, stack, metaspace, direct memory, and object lifetimes.
      - Explain how allocation and reachability relate to garbage collection.
      - Distinguish throughput, latency, footprint, and pause-time tradeoffs.
      - Recognize symptoms of leaks, pressure, promotion, and excessive allocation.
      - Plan safe evidence gathering before changing JVM settings.
    topics:
      - Runtime memory areas and allocation paths
      - Reachability and generational collection concepts
      - Collector goals and version-qualified defaults
      - Heap sizing, container limits, and direct memory
      - Leak patterns and object-retention analysis
      - Logs, recordings, and responsible tuning workflow
    topicsToAvoid:
      - Universal heap-size formulas
      - Collector folklore without measurements
      - Vendor-specific flags as the primary teaching material

  - id: performance-measurement
    title: Performance Measurement Without Guesswork
    targetWords: 5000
    objectives:
      - Define a performance question with a measurable workload and target.
      - Separate latency, throughput, allocation, utilization, and scalability.
      - Design repeatable measurements that account for warmup and variance.
      - Use profiling and flight recordings to form testable hypotheses.
      - Avoid benchmark conclusions that exceed the evidence.
    topics:
      - Workload modeling and service-level objectives
      - Warmup, steady state, variance, and confidence
      - Microbenchmarks and JMH concepts
      - Profilers, Java Flight Recorder, and observability signals
      - Allocation, contention, I/O, and CPU attribution
      - Regression thresholds and communicating results
    topicsToAvoid:
      - Fabricated benchmark numbers
      - Tool-specific tutorials that age quickly
      - Optimizing before establishing a bottleneck

  - id: maintainable-api-design
    title: Maintainable Java API Design
    targetWords: 5000
    objectives:
      - Design APIs around stable responsibilities and clear invariants.
      - Choose method, type, generic, and error contracts that guide callers.
      - Preserve compatibility while evolving public APIs.
      - Make illegal states difficult to represent where the cost is justified.
      - Review APIs for usability, testability, and operational clarity.
    topics:
      - Public versus internal boundaries
      - Immutability, builders, factories, and value types
      - Naming, parameter objects, and overload design
      - Nullability, errors, and compatibility contracts
      - Binary, source, and behavioral compatibility
      - Documentation and deprecation strategy
    topicsToAvoid:
      - Publishing framework-specific REST conventions
      - API design as a style-only exercise
      - Compatibility guarantees that depend on an unmentioned platform

  - id: testing
    title: Testing Modern Java Systems
    targetWords: 5000
    objectives:
      - Match unit, component, integration, and contract tests to risks.
      - Test behavior, boundaries, failures, and concurrency deliberately.
      - Use test doubles without hiding integration defects.
      - Improve legacy test suites while preserving useful feedback speed.
      - Evaluate test quality beyond line coverage.
    topics:
      - Test seams and dependency design
      - Example-based, property-based, and parameterized tests
      - Fakes, stubs, mocks, and contract tests
      - Time, randomness, I/O, and external-system boundaries
      - Concurrency and performance test constraints
      - Mutation, coverage, and diagnostic value
    topicsToAvoid:
      - A framework-specific testing cookbook
      - Coverage percentages as a quality guarantee
      - Tests that depend on network services or wall-clock luck

  - id: modernizing-java-8
    title: Modernizing a Java 8 Codebase
    targetWords: 5500
    objectives:
      - Assess a Java 8 system before selecting a target release.
      - Plan incremental language, library, build, and runtime upgrades.
      - Refactor safely toward modern APIs without creating broad churn.
      - Identify compatibility risks in dependencies, reflection, and operations.
      - Define validation and rollback checkpoints for modernization work.
    topics:
      - Inventory, baseline tests, and upgrade constraints
      - Build plugins, dependencies, and removed or encapsulated internals
      - Incremental adoption of lambdas, streams, records, and sealed types
      - Runtime images, deployment, and observability changes
      - Deprecation, compatibility, and rollout planning
      - Measuring modernization value and managing scope
    topicsToAvoid:
      - Framework migration recipes
      - A release-by-release changelog
      - Big-bang rewrites as the default recommendation

  - id: senior-interview-preparation
    title: Senior Java Interview Preparation
    targetWords: 4500
    objectives:
      - Explain modern Java decisions with constraints and tradeoffs.
      - Structure answers about design, concurrency, JVM behavior, and testing.
      - Diagnose realistic code and performance scenarios aloud.
      - Distinguish precise senior reasoning from memorized terminology.
      - Practice communicating uncertainty and validation plans responsibly.
    topics:
      - Object design and maintainability prompts
      - Collections, generics, and API contract questions
      - Streams, errors, records, and pattern matching scenarios
      - Concurrency, virtual threads, and JVM troubleshooting
      - Performance investigation and modernization case studies
      - Answer structure, assumptions, tradeoffs, and follow-up questions
    topicsToAvoid:
      - Trivia-only question banks
      - Claims about hiring-company processes
      - Leaked or purportedly real interview questions

  - id: exercises-and-solutions
    title: "Exercises and Solutions: Design a Modern Java Service"
    targetWords: 4500
    objectives:
      - Combine the book's design and language concepts in a coherent exercise.
      - Refactor a deliberately constrained service in small, reviewable steps.
      - Explain choices involving collections, errors, concurrency, and testing.
      - Measure and improve a performance issue without inventing evidence.
      - Compare a strong solution with reasonable alternatives and tradeoffs.
    topics:
      - Requirements, invariants, and API sketching
      - Domain modeling with records and sealed types
      - Collection and error-boundary decisions
      - Task execution, cancellation, and virtual-thread considerations
      - Test strategy and performance investigation
      - Annotated solution, alternatives, and review checklist
    topicsToAvoid:
      - A framework-dependent capstone application
      - Copy-paste solutions without reasoning
      - Treating one implementation as universally correct
