book:
  id: spring-boot
  title: Modern Spring Boot and Spring AI
  subtitle: Production Spring Boot 4.1 and Spring AI 2.0 with Java 25
  audience:
    - experienced Java developers modernizing to Spring Boot 4
    - senior backend and full-stack engineers preparing for interviews
    - developers building production AI applications with Spring AI
    - architects evaluating Spring for enterprise AI systems

style:
  tone: practical
  includeInterviewQuestions: true
  includeExercises: true

output:
  markdown: true
  zip: true

chapters:
  - id: modern-spring-platform
    title: The Modern Spring Platform
    targetWords: 4000
    objectives:
      - Position Spring Framework 7, Spring Boot 4.1, Spring AI 2.0, and Java 25 in the current Spring ecosystem
      - Explain what Spring Boot adds to the Spring Framework programming model
      - Explain dependency management, starters, auto-configuration, and executable applications
      - Establish the book's production-first approach and version boundaries
      - Distinguish permanent platform capabilities from preview or rapidly evolving AI integrations
    topics:
      - Spring Framework and Spring Boot roles
      - dependency management and starters
      - auto-configuration
      - executable applications
      - version boundaries
    canonicalExample:
      name: knowledge-assistant
      description: >
        A production-oriented enterprise knowledge assistant evolves throughout the book,
        beginning as a conventional Spring Boot service and later adding Spring AI chat,
        retrieval, tools, memory, evaluation, and MCP.
      entities:
        - KnowledgeArticle
        - KnowledgeService
        - SearchRequest
        - SearchResponse
      constraints:
        - Use Java 25 language features only when they improve clarity
        - Use constructor injection for required dependencies
        - Keep domain logic independent of Spring where practical
        - Use current Spring Boot 4.1 and Spring AI 2.0 APIs

  - id: dependency-injection-configuration
    title: Dependency Injection, Beans, and Configuration
    targetWords: 5500
    objectives:
      - Explain inversion of control and dependency injection beyond annotation memorization
      - Cover component scanning, bean registration, scopes, lifecycle, and conditional configuration
      - Prefer constructor injection and explain when explicit @Bean configuration is appropriate
      - Use @ConfigurationProperties for type-safe external configuration
      - Explain profiles, environment variables, configuration precedence, and secret handling
      - Show how auto-configuration backs off when application beans take control
    topics:
      - inversion of control
      - bean registration and lifecycle
      - constructor injection
      - configuration properties
      - profiles and configuration precedence
    canonicalExample:
      name: knowledge-assistant
      description: Configure the core knowledge service and external content repositories.
      entities:
        - KnowledgeService
        - KnowledgeRepository
        - SearchProperties
        - Clock
      constraints:
        - Prefer immutable configuration records where supported
        - Avoid field injection
        - Do not use profiles as a substitute for sound application design

  - id: web-rest-apis
    title: Building HTTP APIs with Spring MVC
    targetWords: 6000
    objectives:
      - Build REST endpoints with Spring MVC and @RestController
      - Explain request mapping, path variables, query parameters, headers, and request bodies
      - Design request and response DTOs rather than exposing persistence entities
      - Use Jakarta Bean Validation and ProblemDetail-based error responses
      - Explain content negotiation, HTTP semantics, status codes, and idempotency
      - Compare synchronous MVC with reactive WebFlux without implying one is universally superior
    topics:
      - Spring MVC request mapping
      - API DTOs
      - Bean Validation
      - ProblemDetail errors
      - HTTP semantics and idempotency
    canonicalExample:
      name: knowledge-assistant
      description: Expose article and search endpoints for the knowledge service.
      entities:
        - KnowledgeController
        - CreateArticleRequest
        - ArticleResponse
        - SearchRequest
        - SearchResponse
      constraints:
        - Use explicit API DTOs
        - Use ProblemDetail for HTTP error contracts
        - Keep controllers thin

  - id: persistence-transactions
    title: Persistence, Spring Data, and Transactions
    targetWords: 6500
    objectives:
      - Explain persistence boundaries using Spring Data JPA and Hibernate
      - Model entities separately from API DTOs
      - Cover repository queries, pagination, projections, fetch plans, and the N+1 problem
      - Explain persistence context, dirty checking, lazy loading, and optimistic locking
      - Place transaction boundaries deliberately and explain proxy-based @Transactional behavior
      - Cover isolation, rollback rules, and the dangers of slow external calls inside transactions
    topics:
      - Spring Data repositories
      - JPA entities and DTOs
      - fetch planning and N+1 queries
      - transaction boundaries
      - locking and isolation
    canonicalExample:
      name: knowledge-assistant
      description: Persist knowledge articles and metadata in PostgreSQL.
      entities:
        - KnowledgeArticleEntity
        - KnowledgeArticleRepository
        - KnowledgeArticleService
        - ArticleMapper
      constraints:
        - Use PostgreSQL-oriented examples without coupling the domain model to PostgreSQL
        - Avoid Open Session in View as a solution to poor fetch planning
        - Use Flyway-style migration thinking even when full migration scripts are omitted

  - id: security
    title: Securing Spring Boot Applications
    targetWords: 6500
    objectives:
      - Explain Spring Security's filter-chain model
      - Configure SecurityFilterChain with current component-based configuration
      - Distinguish authentication from authorization and 401 from 403
      - Cover OAuth 2.0 and OpenID Connect concepts relevant to resource servers
      - Validate JWT issuer, audience, signature, and time-based claims
      - Explain method authorization, CORS, CSRF, sessions, bearer tokens, and secure cookies
      - Establish security boundaries that remain valid when AI features are added later
    topics:
      - filter-chain architecture
      - authentication and authorization
      - OAuth2 and OIDC
      - JWT validation
      - CSRF CORS and secure cookies
    canonicalExample:
      name: knowledge-assistant
      description: Protect article management and search APIs by role and scope.
      entities:
        - SecurityConfiguration
        - KnowledgeController
        - KnowledgeService
      constraints:
        - Use SecurityFilterChain rather than obsolete adapter-based configuration
        - Never place authorization decisions only in the UI
        - Never log credentials or bearer tokens

  - id: testing-spring-boot
    title: Testing Spring Boot Without Testing Everything at Once
    targetWords: 6000
    objectives:
      - Separate unit, slice, integration, and end-to-end testing responsibilities
      - Use JUnit, Mockito, @WebMvcTest, @DataJpaTest, and @SpringBootTest intentionally
      - Use Testcontainers for realistic disposable infrastructure
      - Test validation, security, persistence, transaction boundaries, and HTTP contracts
      - Explain test design that survives refactoring
      - Establish a testing strategy that later extends to nondeterministic AI behavior
    topics:
      - unit and slice tests
      - integration tests and Testcontainers
      - HTTP and validation contracts
      - security and transaction tests
      - refactoring-safe test design
    canonicalExample:
      name: knowledge-assistant
      description: Test the knowledge API and PostgreSQL persistence layer.
      entities:
        - KnowledgeServiceTest
        - KnowledgeControllerTest
        - KnowledgeRepositoryTest
      constraints:
        - Prefer behavior-focused assertions
        - Do not start a full Spring context for ordinary unit tests
        - Use real infrastructure selectively where it materially improves confidence

  - id: production-observability
    title: 'Production Spring Boot: Actuator, Observability, and Operations'
    targetWords: 6000
    objectives:
      - Configure Actuator health, readiness, liveness, metrics, and management endpoints
      - Explain Micrometer metrics and distributed tracing at a practical level
      - Use structured logging without leaking secrets
      - Cover graceful shutdown, externalized configuration, timeouts, resource pools, and failure isolation
      - Explain virtual threads in Spring Boot 4.1 and when they improve blocking I/O workloads
      - Explain why virtual threads do not remove downstream capacity limits
      - Prepare the observability model for later AI model and vector-store operations
    topics:
      - Actuator health and management
      - Micrometer metrics and tracing
      - structured logging
      - graceful shutdown and resource limits
      - virtual threads and downstream capacity
    canonicalExample:
      name: knowledge-assistant
      description: Operate and observe the knowledge service in production.
      entities:
        - KnowledgeService
        - HealthIndicator
        - SearchMetrics
      constraints:
        - Prefer Java 24 or later when demonstrating Spring Boot virtual threads
        - Distinguish application concurrency from database and external-service capacity
        - Avoid exposing sensitive Actuator endpoints publicly

  - id: spring-ai-foundations
    title: Spring AI 2.0 Foundations
    targetWords: 6000
    objectives:
      - Explain Spring AI's role in connecting enterprise data and APIs with AI models
      - Configure Spring AI 2.0 with Spring Boot 4.1 using the current BOM and starter naming
      - Explain portable Model APIs and provider-specific options
      - Introduce ChatModel, EmbeddingModel, ImageModel, and other model abstractions
      - Explain synchronous and streaming model interactions
      - Show when provider portability helps and when provider-specific capabilities are necessary
      - Cover upgrade-sensitive Spring AI 2.0 module and starter changes
    topics:
      - Spring AI abstractions
      - BOMs starters and version boundaries
      - ChatModel and EmbeddingModel
      - synchronous and streaming interactions
      - provider portability
    canonicalExample:
      name: knowledge-assistant-ai
      description: Add a model-backed assistant to the existing knowledge service.
      entities:
        - AssistantService
        - ChatModel
        - AssistantProperties
        - AssistantResponse
      constraints:
        - Use Spring AI 2.0 artifact names and APIs
        - Use Spring Boot 4.1-compatible configuration
        - Avoid deprecated pre-2.0 starter names
        - Do not pretend all providers expose identical capabilities

  - id: chatclient-prompts-structured-output
    title: ChatClient, Prompts, and Structured Output
    targetWords: 6500
    objectives:
      - Use ChatClient as the primary fluent API for model interactions
      - Explain system and user messages, prompt templates, options, and request construction
      - Cover synchronous calls and streaming behavior with its stack implications
      - Map model output into application types safely
      - Design prompts as maintainable application artifacts rather than scattered strings
      - Handle model errors, malformed output, retries, timeouts, and token usage
      - Test model-facing code without requiring live paid calls
    topics:
      - ChatClient request construction
      - prompt templates
      - streaming behavior
      - structured output validation
      - model errors retries and token usage
    canonicalExample:
      name: knowledge-assistant-ai
      description: Implement typed question-answering and summarization operations.
      entities:
        - AssistantService
        - ChatClient
        - AnswerResponse
        - SummaryResponse
      constraints:
        - Keep prompts versioned and testable
        - Validate structured output before trusting it
        - Separate model-facing DTOs from persistence entities

  - id: advisors-memory
    title: Advisors, Conversation Memory, and Request Context
    targetWords: 6000
    objectives:
      - Explain the Advisors API as reusable interception and augmentation around ChatClient
      - Show advisor ordering and why execution order changes behavior
      - Use chat memory intentionally rather than assuming models remember prior requests
      - Explain conversation IDs and request-scoped memory context
      - Build custom advisors for cross-cutting AI concerns
      - Cover logging and observability advisors without leaking prompts or sensitive content
      - Distinguish conversational memory from durable business state
    topics:
      - Advisors API and ordering
      - conversation memory
      - conversation identifiers
      - custom advisors
      - privacy and observability
    canonicalExample:
      name: knowledge-assistant-ai
      description: Add controlled conversation memory and reusable assistant policies.
      entities:
        - AssistantService
        - ChatMemory
        - MessageChatMemoryAdvisor
        - AssistantPolicyAdvisor
      constraints:
        - Supply conversation IDs explicitly where required
        - Do not treat chat memory as a system of record
        - Make advisor ordering visible in examples

  - id: embeddings-vector-stores-rag
    title: Embeddings, Vector Stores, and Retrieval-Augmented Generation
    targetWords: 7500
    objectives:
      - Explain embeddings and similarity search without hiding their limitations
      - Use Spring AI's portable VectorStore API and metadata filtering
      - Build ingestion pipelines with Spring AI ETL concepts
      - Implement naive RAG with QuestionAnswerAdvisor
      - Implement modular RAG with RetrievalAugmentationAdvisor and RAG building blocks
      - Discuss chunking, metadata, retrieval quality, reranking, and context limits
      - Cover PostgreSQL and PGvector as a practical example while preserving VectorStore abstraction; identify failure modes such as irrelevant retrieval, stale content, and context pollution
    topics:
      - embeddings and similarity
      - VectorStore APIs
      - ingestion pipelines
      - naive and modular RAG
      - chunking metadata and retrieval evaluation
    canonicalExample:
      name: knowledge-assistant-rag
      description: Retrieve enterprise knowledge articles and ground model responses in current content.
      entities:
        - KnowledgeDocumentLoader
        - VectorStore
        - EmbeddingModel
        - QuestionAnswerAdvisor
        - RetrievalAugmentationAdvisor
      constraints:
        - Keep source-document IDs and metadata traceable
        - Do not equate vector similarity with factual correctness
        - Explain retrieval evaluation separately from generation evaluation

  - id: tool-calling
    title: Tool Calling and Safe Enterprise Actions
    targetWords: 6500
    objectives:
      - Explain Spring AI tool calling and the model/tool execution loop
      - Expose application capabilities with @Tool and function-style tools
      - Design tool schemas and descriptions so models can select tools reliably
      - Pass tool context safely without exposing it to the model unnecessarily
      - Understand ToolCallingAdvisor behavior and advisor ordering
      - Separate read-only tools from state-changing operations
      - Apply authorization, validation, idempotency, auditing, and human confirmation to consequential actions; test tool selection and execution independently from live model calls
    topics:
      - tool schemas and descriptions
      - tool execution loops
      - read-only and mutating tools
      - authorization validation and idempotency
      - testing tool behavior
    canonicalExample:
      name: knowledge-assistant-tools
      description: Allow the assistant to search internal services and create a controlled support request.
      entities:
        - KnowledgeTools
        - SupportRequestTools
        - ToolCallingAdvisor
        - AssistantService
      constraints:
        - Never let model intent bypass server-side authorization
        - Validate tool inputs exactly like ordinary API inputs
        - Require explicit safeguards for state-changing actions

  - id: mcp
    title: Model Context Protocol with Spring AI
    targetWords: 6500
    objectives:
      - Explain MCP's client-server model and where it fits relative to direct tool calling
      - Build Spring applications that consume MCP servers
      - Expose Spring-based capabilities through MCP servers
      - Cover Spring AI 2.0's MCP starter and module model and MCP Java SDK 2.0 implications
      - Explain tools, resources, prompts, transport choices, lifecycle, and capability discovery
      - Apply authentication, authorization, secret handling, and network-boundary controls
      - Decide when MCP is appropriate and when an ordinary HTTP API or local tool is simpler
    topics:
      - MCP client-server model
      - tools resources and prompts
      - Spring AI MCP modules
      - transport and lifecycle
      - security and capability discovery
    canonicalExample:
      name: knowledge-assistant-mcp
      description: Expose enterprise knowledge search as an MCP capability and consume an external MCP service.
      entities:
        - KnowledgeMcpServer
        - KnowledgeMcpClient
        - KnowledgeService
        - AssistantService
      constraints:
        - Use Spring AI 2.0 MCP APIs and current starter naming
        - Account for MCP Java SDK 2.0 changes
        - Avoid presenting MCP as mandatory for every tool integration

  - id: multimodal-models
    title: Multimodal and Provider-Specific AI Capabilities
    targetWords: 5000
    objectives:
      - Explain Spring AI support for chat, embeddings, image generation, transcription, and text-to-speech
      - Handle multimodal input and output where supported
      - Explain portable model APIs versus provider-specific options
      - Design capability checks rather than assuming every provider supports every feature
      - Handle large media, content types, limits, and external storage safely
      - Keep multimodal concerns separate from the core business domain
    topics:
      - multimodal model APIs
      - provider-specific capabilities
      - image and document inputs
      - media storage boundaries
      - privacy and retention
    canonicalExample:
      name: knowledge-assistant-multimodal
      description: Add document and image understanding and audio transcription as optional assistant capabilities.
      entities:
        - MediaAssistantService
        - ImageModel
        - TranscriptionModel
        - ChatModel
      constraints:
        - Treat provider capabilities as explicit
        - Avoid embedding large binary media directly in domain entities
        - Address privacy and retention concerns for uploaded content

  - id: evaluation-testing-ai
    title: Evaluating and Testing AI Systems
    targetWords: 7000
    objectives:
      - Explain why ordinary deterministic unit tests are insufficient for model quality
      - Separate deterministic application tests from probabilistic model evaluation
      - Evaluate response relevance, factual grounding, retrieval quality, and tool behavior
      - Use Spring AI evaluation utilities where appropriate
      - Build repeatable datasets and regression suites
      - Measure failure rates instead of relying on anecdotal prompts; test prompt, model, retrieval, advisor, and tool changes independently where possible
      - Test prompt, model, retrieval, advisor, and tool changes independently where possible
    topics:
      - deterministic application tests
      - model evaluation datasets
      - grounding and retrieval quality
      - tool behavior evaluation
      - regression thresholds and human review
    canonicalExample:
      name: knowledge-assistant-evaluation
      description: Build regression evaluations for grounded answers, retrieval, and tool calls.
      entities:
        - AssistantEvaluation
        - RetrievalEvaluation
        - ToolEvaluation
        - EvaluationDataset
      constraints:
        - Keep evaluation datasets versioned
        - Never make a single model response the only release criterion
        - Distinguish automated evaluation from human review

  - id: observability-security-ai
    title: Observability, Security, and Governance for Spring AI
    targetWords: 6500
    objectives:
      - Observe model, ChatClient, advisor, vector-store, and tool operations
      - Capture latency, token usage, errors, retrieval behavior, and tool-call outcomes
      - Prevent sensitive prompt and response data from leaking through logs or traces
      - Address prompt injection, indirect prompt injection, data exfiltration, and unsafe tool invocation
      - Apply least privilege to model-accessible tools and retrieved data
      - Design audit trails for consequential operations
      - Explain model and prompt versioning, retention, privacy, and governance concerns; define production failure modes and graceful degradation
    topics:
      - AI operation metrics and traces
      - sensitive-data redaction
      - prompt injection and data exfiltration
      - least-privilege tools
      - audit governance and graceful degradation
    canonicalExample:
      name: knowledge-assistant-production
      description: Harden the assistant for enterprise deployment.
      entities:
        - AssistantService
        - AssistantObservability
        - SecurityConfiguration
        - KnowledgeTools
      constraints:
        - Never log secrets or full sensitive prompts by default
        - Enforce authorization outside the model
        - Treat retrieved content as untrusted input

  - id: production-architecture
    title: Production Architecture for Spring Boot and Spring AI
    targetWords: 7000
    objectives:
      - Assemble the book's concepts into a maintainable production architecture
      - Separate HTTP APIs, application services, domain logic, AI orchestration, retrieval, tools, and infrastructure
      - Decide what belongs in Spring AI Advisors versus ordinary application services
      - Design timeouts, retries, concurrency limits, model fallbacks, and circuit-breaking boundaries
      - Explain synchronous versus streaming API design and operational implications
      - Cover persistence of conversations, traces, evaluations, and source metadata
      - Plan deployment, configuration, secrets, observability, and scaling while avoiding unnecessary microservices and AI-specific abstractions
    topics:
      - layered application architecture
      - AI orchestration boundaries
      - timeouts retries and fallbacks
      - streaming API design
      - deployment scaling and secrets
    canonicalExample:
      name: knowledge-assistant-production
      description: Finalize the enterprise knowledge assistant architecture for production.
      entities:
        - KnowledgeController
        - AssistantService
        - KnowledgeService
        - VectorStore
        - KnowledgeTools
        - SecurityConfiguration
      constraints:
        - Keep domain rules outside prompts
        - Keep provider SDK details behind Spring AI abstractions or focused adapters
        - Scale scarce resources deliberately rather than relying on thread counts alone

  - id: modernization-migration
    title: Migrating to Spring Boot 4 and Spring AI 2
    targetWords: 5500
    objectives:
      - Plan migration from Spring Boot 2 and 3-era applications to Spring Boot 4
      - Address Java baseline, Jakarta namespaces, dependency updates, and removed or deprecated configuration styles
      - Explain current SecurityFilterChain-based security configuration
      - Migrate older Spring AI starter names and module assumptions to Spring AI 2.0
      - Cover Spring AI 2.0 autoconfiguration modularization and removed modules
      - Address MCP Java SDK 2.0 changes when upgrading MCP integrations
      - Build an incremental modernization strategy with tests and observability at each step
    topics:
      - upgrade inventory and baselines
      - Spring Boot migration planning
      - dependency and API compatibility
      - incremental rollout and rollback
      - measuring modernization value
    canonicalExample:
      name: knowledge-assistant-migration
      description: Modernize an older Spring application while adding AI capabilities incrementally.
      entities:
        - LegacyKnowledgeService
        - KnowledgeService
        - SecurityConfiguration
        - AssistantService
      constraints:
        - Prefer incremental migration over simultaneous architectural rewrites
        - Clearly distinguish legacy examples from recommended current code
        - Use current artifact IDs in all final examples

  - id: senior-interview-workbook
    title: Senior Spring Boot and Spring AI Interview Workbook
    targetWords: 5000
    objectives:
      - Synthesize the most important Spring Boot and Spring AI concepts into senior-level interview questions
      - Test architectural reasoning rather than annotation memorization
      - Include debugging and code-review scenarios
      - Include API, persistence, transaction, security, testing, and observability questions
      - Include ChatClient, Advisors, RAG, tools, MCP, evaluation, and production AI questions
      - Provide concise model answers and explain what strong senior answers demonstrate
      - Include architecture tradeoff exercises that combine conventional Spring and AI concerns
    topics:
      - Spring fundamentals and configuration
      - web persistence and security scenarios
      - Spring AI architecture questions
      - production diagnosis
      - tradeoff-based answer practice
    canonicalExample:
      name: knowledge-assistant-interview
      description: Reuse the enterprise knowledge assistant as the basis for design and debugging scenarios.
      entities:
        - KnowledgeService
        - AssistantService
        - VectorStore
        - KnowledgeTools
        - SecurityConfiguration
      constraints:
        - Avoid certification trivia
        - Emphasize reasoning, tradeoffs, failure modes, and production decisions
        - Keep model answers concise enough for actual interview preparation

  - id: exercises-solutions
    title: Capstone Exercises and Solutions
    targetWords: 6000
    objectives:
      - Provide cumulative exercises covering the complete Spring Boot and Spring AI stack
      - Design a production REST API with validation, persistence, security, and observability
      - Add ChatClient-based AI capabilities without leaking domain responsibilities into prompts
      - Add RAG, tool calling, and MCP where appropriate
      - Build deterministic tests and AI evaluation suites
      - Diagnose security, transaction, retrieval, concurrency, and observability failures
      - Provide solutions with reasoning and alternative valid approaches
    topics:
      - requirements and domain boundaries
      - API and persistence design
      - security and testing strategy
      - AI retrieval and tool decisions
      - production review and tradeoffs
    canonicalExample:
      name: knowledge-assistant-capstone
      description: Complete and critique the enterprise knowledge assistant built throughout the book.
      entities:
        - KnowledgeController
        - KnowledgeService
        - AssistantService
        - VectorStore
        - KnowledgeTools
        - KnowledgeMcpServer
        - SecurityConfiguration
      constraints:
        - Solutions should explain tradeoffs rather than present one architecture as universally correct
        - Reuse terminology and boundaries established earlier in the book
        - Avoid introducing major new concepts in the final chapter
